[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "openai>=1.54",
    "httpx>=0.27",
    "pymupdf>=1.24",          # PDF parse
    "python-multipart>=0.0.9", # file upload
    "pydantic-settings>=2.5",
    "tiktoken>=0.8",           # token counting
    "lingua-language-detector>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx",                   # test client
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
