services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vchat
      POSTGRES_PASSWORD: vchat
      POSTGRES_DB: vchat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vchat"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://vchat:vchat@postgres:5432/vchat"
      OBJECT_DIR: "/data/objects"
      # On Windows/Mac Docker Desktop, host.docker.internal resolves to the host.
      # If your gateway URLs use Tailscale hostnames, replace them here so the
      # container can reach them through the host's Tailscale connection:
      #   CHAT_BASE_URL: "http://host.docker.internal:8080/v1"
      #   EMBED_BASE_URL: "http://host.docker.internal:8080/v1"
      #   ASR_BASE_URL:  "http://host.docker.internal:8080/v1"
      #   TTS_BASE_URL:  "http://host.docker.internal:8080/v1"
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux too
      - "host.docker.internal:host-gateway"
    volumes:
      - objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  objects:
